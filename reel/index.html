<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daniela Galli · Demo Reel</title>
  <meta name="robots" content="noindex">
  <style>
    body { margin: 0; min-height: 100vh; background: #0e0e0f; color: #ececec;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 16px; box-sizing: border-box; }
    .player { width: 100%; max-width: 1100px; aspect-ratio: 16 / 9; background: #000; }
    .player iframe { width: 100%; height: 100%; border: 0; }
    p { color: #9a9a9a; margin: 16px 0 0; }
  </style>
</head>
<body>

  <script>
    // ===== TO CHANGE THE VIDEO: paste the new Vimeo or YouTube link between the quotes =====
    var VIDEO = "https://vimeo.com/danielagalli/dg-reel";
  </script>

  <div class="player" id="player"></div>

  <p>Daniela Galli</p>
  <script>
    // Turns the link above into a video player. No need to touch this part.
    var box = document.getElementById("player");
    function show(src) {
      box.innerHTML = '<iframe src="' + src + '" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>';
    }
    var VIMEO_OPTIONS = "title=0&byline=0&portrait=0"; // hides the video name, your name and profile picture
    var m;
    if ((m = VIDEO.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/([0-9a-f]+))?/i))) {
      var h = m[2] || (VIDEO.match(/[?&]h=([0-9a-f]+)/i) || [])[1];
      show("https://player.vimeo.com/video/" + m[1] + "?" + VIMEO_OPTIONS + (h ? "&h=" + h : ""));
    } else if (/vimeo\.com\//i.test(VIDEO)) {
      // Named Vimeo links (like vimeo.com/name/video): ask Vimeo for the video number.
      fetch("https://vimeo.com/api/oembed.json?url=" + encodeURIComponent(VIDEO.split("?")[0]))
        .then(function (r) { return r.json(); })
        .then(function (d) { show("https://player.vimeo.com/video/" + d.video_id + "?" + VIMEO_OPTIONS); })
        .catch(function () { box.innerHTML = '<p style="padding:16px"><a href="' + VIDEO + '">Watch the video on Vimeo</a></p>'; });
    } else if ((m = VIDEO.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/))) {
      show("https://www.youtube-nocookie.com/embed/" + m[1] + "?rel=0");
    } else {
      show(VIDEO);
    }
  </script>
</body>
</html>
