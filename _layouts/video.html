<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · {{ site.title }}</title>
  <meta name="robots" content="noindex">
  <meta property="og:title" content="{{ page.title }} · {{ site.title }}">
  {% if page.description %}<meta property="og:description" content="{{ page.description | strip_html | escape }}">{% endif %}
  {% if page.image %}<meta property="og:image" content="{{ page.image }}">{% endif %}
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #0e0e0f; color: #ececec;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px 16px;
    }
    main { width: 100%; max-width: 1100px; }
    .player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; overflow: hidden; }
    .player.vertical { aspect-ratio: 9 / 16; max-width: 420px; margin: 0 auto; }
    .player iframe, .player video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    h1 { font-size: 1.4rem; font-weight: 600; margin: 20px 0 4px; }
    .name { color: #9a9a9a; margin: 0; }
    .description { color: #c8c8c8; margin-top: 12px; }
    a { color: #ececec; }
  </style>
</head>
<body>
  <main>
    <div class="player{% if page.vertical %} vertical{% endif %}" id="player" data-video="{{ page.video | escape }}">
      <noscript><p style="padding:16px"><a href="{{ page.video | escape }}">Watch the video</a></p></noscript>
    </div>
    <h1>{{ page.title }}</h1>
    <p class="name">{{ site.title }}</p>
    {% if content != "" %}<div class="description">{{ content }}</div>{% endif %}
  </main>
  <script>
    // Turns a normal Vimeo or YouTube link into an embedded player.
    (function () {
      var box = document.getElementById('player');
      var link = box.getAttribute('data-video').trim();
      var src = null, m;

      if ((m = link.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/([0-9a-f]+))?/i))) {
        var hash = m[2] || (link.match(/[?&]h=([0-9a-f]+)/i) || [])[1];
        src = 'https://player.vimeo.com/video/' + m[1] + '?dnt=1' + (hash ? '&h=' + hash : '');
      } else if ((m = link.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/i))) {
        src = 'https://www.youtube-nocookie.com/embed/' + m[1] + '?rel=0';
      }

      if (src) {
        var f = document.createElement('iframe');
        f.src = src;
        f.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media';
        f.allowFullscreen = true;
        f.title = document.title;
        box.appendChild(f);
      } else if (/\.(mp4|webm|mov)(\?|$)/i.test(link)) {
        var v = document.createElement('video');
        v.src = link; v.controls = true; v.playsInline = true;
        box.appendChild(v);
      } else {
        box.innerHTML = '<p style="padding:16px"><a href="' + encodeURI(link) + '">Watch the video</a></p>';
      }
    })();
  </script>
</body>
</html>
