title: Daniela Galli

# Each file in the _videos folder becomes its own page.
# _videos/demo-reel.md  ->  https://dsgalli.github.io/demo-reel/
collections:
  videos:
    output: true
    permalink: /:name/

defaults:
  - scope:
      type: videos
    values:
      layout: video

exclude:
  - README.md
